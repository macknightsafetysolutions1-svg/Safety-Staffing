services:
  - type: web
    name: macknight-prospecting
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Set APP_ORIGIN in the Render dashboard to your full https URL
      # Example: https://macknight-prospecting.onrender.com
